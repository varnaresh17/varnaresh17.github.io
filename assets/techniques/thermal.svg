<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 480 240" role="img" aria-labelledby="thermal-svg-title thermal-svg-desc"><title id="thermal-svg-title">Basic principle of TGA / DTA / DSC</title><desc id="thermal-svg-desc">Apply a controlled temperature program. TGA tracks mass; DTA tracks sample–reference temperature difference; DSC measures heat-flow difference.</desc><defs><marker id="arr-thermal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f806b"/></marker></defs><style>text{font:13px Arial,sans-serif;fill:#243d35}.small{font-size:11px}.center{text-anchor:middle}.green,.blue,.orange,.gray{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#3e8264}.blue{stroke:#547dad}.orange{stroke:#c48a42}.gray{stroke:#8e9f96}.box{fill:#f5f7f0;stroke:#8fa794;stroke-width:1.4}.sample{fill:#d6e6c8;stroke:#73926a;stroke-width:1.4}.dot,.green-fill{fill:#4f8d69}.sphere{fill:#ecf3df;stroke:#8fa794;stroke-width:2}.furnace{fill:#f8eddd;stroke:#cda36f;stroke-width:2}</style><rect x="90" y="45" width="300" height="135" rx="10" class="furnace"/><rect x="120" y="85" width="95" height="50" rx="6" class="box"/><text x="167.5" y="114.0" class="center">Sample</text><rect x="265" y="85" width="95" height="50" rx="6" class="box"/><text x="312.5" y="114.0" class="center">Reference</text><text x="180" y="28" class="small">Controlled heating</text><text x="20" y="211" class="small">TGA: mass</text><text x="155" y="211" class="small">DTA: Δtemperature</text><text x="330" y="211" class="small">DSC: heat flow</text></svg>