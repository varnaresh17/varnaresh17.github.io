<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 480 240" role="img" aria-labelledby="xel-svg-title xel-svg-desc"><title id="xel-svg-title">Basic principle of X-ray luminescence &amp; imaging</title><desc id="xel-svg-desc">X-rays deposit energy in a scintillator, which emits light. Resolve that light spectrally or detect its spatial pattern and dose-dependent intensity.</desc><defs><marker id="arr-xel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f806b"/></marker></defs><style>text{font:13px Arial,sans-serif;fill:#243d35}.small{font-size:11px}.center{text-anchor:middle}.green,.blue,.orange,.gray{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#3e8264}.blue{stroke:#547dad}.orange{stroke:#c48a42}.gray{stroke:#8e9f96}.box{fill:#f5f7f0;stroke:#8fa794;stroke-width:1.4}.sample{fill:#d6e6c8;stroke:#73926a;stroke-width:1.4}.dot,.green-fill{fill:#4f8d69}.sphere{fill:#ecf3df;stroke:#8fa794;stroke-width:2}.furnace{fill:#f8eddd;stroke:#cda36f;stroke-width:2}</style><rect x="12" y="70" width="75" height="43" rx="6" class="box"/><text x="49.5" y="95.5" class="center">X-rays</text><path d="M87 92L137 92" class="blue" marker-end="url(#arr-xel)"/><rect x="140" y="70" width="72" height="43" rx="6" class="box"/><text x="176.0" y="95.5" class="center">Object</text><text x="145" y="132" class="small">optional</text><path d="M212 92L245 92" class="blue" marker-end="url(#arr-xel)"/><rect x="248" y="53" width="95" height="77" rx="6" class="box"/><text x="295.5" y="95.5" class="center">Scintillator</text><path d="M343 90L380 90" class="green" marker-end="url(#arr-xel)"/><rect x="384" y="70" width="85" height="43" rx="6" class="box"/><text x="426.5" y="95.5" class="center">Sensor</text><path d="M295 132L295 175" class="green" marker-end="url(#arr-xel)"/><text x="180" y="195" class="small">Light → emission spectrum</text><text x="370" y="146" class="small">Image / dose</text><text x="19" y="217" class="small">X-rays deposit energy; the scintillator emits detectable light.</text></svg>