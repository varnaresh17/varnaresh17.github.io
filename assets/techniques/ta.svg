<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 480 240" role="img" aria-labelledby="ta-svg-title ta-svg-desc"><title id="ta-svg-title">Basic principle of Transient absorption</title><desc id="ta-svg-desc">A pump excites the material; a delayed probe measures the change in absorption. Repeat across wavelengths and time delays.</desc><defs><marker id="arr-ta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f806b"/></marker></defs><style>text{font:13px Arial,sans-serif;fill:#243d35}.small{font-size:11px}.center{text-anchor:middle}.green,.blue,.orange,.gray{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#3e8264}.blue{stroke:#547dad}.orange{stroke:#c48a42}.gray{stroke:#8e9f96}.box{fill:#f5f7f0;stroke:#8fa794;stroke-width:1.4}.sample{fill:#d6e6c8;stroke:#73926a;stroke-width:1.4}.dot,.green-fill{fill:#4f8d69}.sphere{fill:#ecf3df;stroke:#8fa794;stroke-width:2}.furnace{fill:#f8eddd;stroke:#cda36f;stroke-width:2}</style><rect x="15" y="30" width="85" height="35" rx="6" class="box"/><text x="57.5" y="51.5" class="center">Pump</text><path d="M100 48L220 101" class="blue" marker-end="url(#arr-ta)"/><rect x="15" y="125" width="85" height="35" rx="6" class="box"/><text x="57.5" y="146.5" class="center">Probe</text><path d="M100 143L150 143" class="orange" marker-end="url(#arr-ta)"/><rect x="153" y="125" width="65" height="35" rx="6" class="box"/><text x="185.5" y="146.5" class="center">Delay</text><path d="M218 143L233 116" class="orange" marker-end="url(#arr-ta)"/><circle cx="245" cy="106" r="14" class="dot"/><path d="M259 106L336 106" class="orange" marker-end="url(#arr-ta)"/><rect x="340" y="84" width="125" height="44" rx="6" class="box"/><text x="402.5" y="110.0" class="center">Spectral detector</text><text x="219" y="151" class="">Sample</text><text x="36" y="193" class="small">Compare pump on/off at each probe delay Δt.</text><text x="36" y="215" class="small">ΔA(λ, Δt) = A_pumped − A_unpumped</text></svg>