<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 480 240" role="img" aria-labelledby="afm-svg-title afm-svg-desc"><title id="afm-svg-title">Basic principle of AFM</title><desc id="afm-svg-desc">A sharp tip scans the surface. Tip–sample forces change cantilever motion; feedback tracks height to build a topographic map.</desc><defs><marker id="arr-afm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f806b"/></marker></defs><style>text{font:13px Arial,sans-serif;fill:#243d35}.small{font-size:11px}.center{text-anchor:middle}.green,.blue,.orange,.gray{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#3e8264}.blue{stroke:#547dad}.orange{stroke:#c48a42}.gray{stroke:#8e9f96}.box{fill:#f5f7f0;stroke:#8fa794;stroke-width:1.4}.sample{fill:#d6e6c8;stroke:#73926a;stroke-width:1.4}.dot,.green-fill{fill:#4f8d69}.sphere{fill:#ecf3df;stroke:#8fa794;stroke-width:2}.furnace{fill:#f8eddd;stroke:#cda36f;stroke-width:2}</style><path d="M100 180L145 180L160 163L190 169L220 156L255 168L285 160L335 180H390V198H100Z" class="sample"/><path d="M153 108Q200 108 255 118L255 125L153 116Z" class="box"/><path d="M244 124L255 153L263 126Z" class="green-fill"/><rect x="15" y="20" width="80" height="32" rx="6" class="box"/><text x="55.0" y="40.0" class="center">Laser</text><path d="M95 36L242 115" class="orange" marker-end="url(#arr-afm)"/><path d="M242 115L380 42" class="orange" marker-end="url(#arr-afm)"/><rect x="360" y="14" width="108" height="38" rx="6" class="box"/><text x="414.0" y="37.0" class="center">Photodetector</text><text x="126" y="92" class="small">Cantilever</text><text x="305" y="133" class="small">Feedback controls z</text><text x="135" y="218" class="small">Tip scans surface → height map</text></svg>