<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 480 240" role="img" aria-labelledby="sem-svg-title sem-svg-desc"><title id="sem-svg-title">Basic principle of SEM / EDS</title><desc id="sem-svg-desc">Scan a focused electron beam. Electron signals form a surface image; characteristic X-rays identify and map elements.</desc><defs><marker id="arr-sem" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f806b"/></marker></defs><style>text{font:13px Arial,sans-serif;fill:#243d35}.small{font-size:11px}.center{text-anchor:middle}.green,.blue,.orange,.gray{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#3e8264}.blue{stroke:#547dad}.orange{stroke:#c48a42}.gray{stroke:#8e9f96}.box{fill:#f5f7f0;stroke:#8fa794;stroke-width:1.4}.sample{fill:#d6e6c8;stroke:#73926a;stroke-width:1.4}.dot,.green-fill{fill:#4f8d69}.sphere{fill:#ecf3df;stroke:#8fa794;stroke-width:2}.furnace{fill:#f8eddd;stroke:#cda36f;stroke-width:2}</style><rect x="185" y="12" width="100" height="33" rx="6" class="box"/><text x="235.0" y="32.5" class="center">Electron gun</text><path d="M235 45L235 142" class="blue" marker-end="url(#arr-sem)"/><path d="M195 72L275 72M203 80L267 80" class="gray"/><text x="140" y="60" class="small">Focused scan</text><path d="M125 155L190 137L245 150L305 135L355 157V180H125Z" class="sample"/><path d="M235 140L110 95" class="green" marker-end="url(#arr-sem)"/><rect x="12" y="66" width="125" height="35" rx="6" class="box"/><text x="74.5" y="87.5" class="center">SE / BSE detector</text><path d="M250 143L360 102" class="orange" marker-end="url(#arr-sem)"/><rect x="340" y="65" width="125" height="35" rx="6" class="box"/><text x="402.5" y="86.5" class="center">EDS detector</text><text x="20" y="205" class="small">Electron signal → morphology</text><text x="270" y="205" class="small">X-rays → elements</text></svg>