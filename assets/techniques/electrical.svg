<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 480 240" role="img" aria-labelledby="electrical-svg-title electrical-svg-desc"><title id="electrical-svg-title">Basic principle of Dielectric &amp; electrical</title><desc id="electrical-svg-desc">Apply an AC or DC stimulus through suitable electrodes and measure voltage/current response. Geometry and impedance yield electrical and dielectric properties.</desc><defs><marker id="arr-electrical" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f806b"/></marker></defs><style>text{font:13px Arial,sans-serif;fill:#243d35}.small{font-size:11px}.center{text-anchor:middle}.green,.blue,.orange,.gray{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#3e8264}.blue{stroke:#547dad}.orange{stroke:#c48a42}.gray{stroke:#8e9f96}.box{fill:#f5f7f0;stroke:#8fa794;stroke-width:1.4}.sample{fill:#d6e6c8;stroke:#73926a;stroke-width:1.4}.dot,.green-fill{fill:#4f8d69}.sphere{fill:#ecf3df;stroke:#8fa794;stroke-width:2}.furnace{fill:#f8eddd;stroke:#cda36f;stroke-width:2}</style><rect x="15" y="82" width="108" height="42" rx="6" class="box"/><text x="69.0" y="107.0" class="center">AC / DC drive</text><path d="M123 103L210 103" class="green" marker-end="url(#arr-electrical)"/><rect x="215" y="70" width="12" height="73" class="green-fill"/><rect x="235" y="70" width="45" height="73" class="sample"/><rect x="288" y="70" width="12" height="73" class="green-fill"/><path d="M300 103L350 103" class="green" marker-end="url(#arr-electrical)"/><rect x="354" y="82" width="110" height="42" rx="6" class="box"/><text x="409.0" y="107.0" class="center">V / I response</text><text x="210" y="168" class="small">Sample + electrodes</text><text x="52" y="209" class="small">Impedance / capacitance → transport and dielectric response</text></svg>