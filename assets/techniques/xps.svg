<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 480 240" role="img" aria-labelledby="xps-svg-title xps-svg-desc"><title id="xps-svg-title">Basic principle of XPS</title><desc id="xps-svg-desc">X-rays eject photoelectrons from the near-surface region. Measure their kinetic energies to determine binding energies and chemical shifts.</desc><defs><marker id="arr-xps" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f806b"/></marker></defs><style>text{font:13px Arial,sans-serif;fill:#243d35}.small{font-size:11px}.center{text-anchor:middle}.green,.blue,.orange,.gray{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#3e8264}.blue{stroke:#547dad}.orange{stroke:#c48a42}.gray{stroke:#8e9f96}.box{fill:#f5f7f0;stroke:#8fa794;stroke-width:1.4}.sample{fill:#d6e6c8;stroke:#73926a;stroke-width:1.4}.dot,.green-fill{fill:#4f8d69}.sphere{fill:#ecf3df;stroke:#8fa794;stroke-width:2}.furnace{fill:#f8eddd;stroke:#cda36f;stroke-width:2}</style><text x="28" y="35" class="">X-ray source</text><path d="M75 47L193 144" class="blue" marker-end="url(#arr-xps)"/><rect x="83" y="151" width="190" height="23" rx="3" class="sample"/><text x="89" y="199" class="small">Near-surface atoms</text><path d="M200 144L310 72" class="orange" marker-end="url(#arr-xps)"/><text x="197" y="93" class="small">Photoelectron</text><rect x="315" y="44" width="145" height="50" rx="6" class="box"/><text x="387.5" y="73.0" class="center">Energy analyzer</text><path d="M388 96L388 136" class="green" marker-end="url(#arr-xps)"/><rect x="306" y="143" width="164" height="49" rx="6" class="box"/><text x="388.0" y="171.5" class="center">Kinetic energy</text><text x="35" y="229" class="small">Known photon energy → binding energy → chemical state</text></svg>