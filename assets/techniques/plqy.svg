<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 480 240" role="img" aria-labelledby="plqy-svg-title plqy-svg-desc"><title id="plqy-svg-title">Basic principle of PLQY</title><desc id="plqy-svg-desc">Compare emitted and absorbed photon numbers. An integrating sphere collects light over many directions for an absolute measurement.</desc><defs><marker id="arr-plqy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f806b"/></marker></defs><style>text{font:13px Arial,sans-serif;fill:#243d35}.small{font-size:11px}.center{text-anchor:middle}.green,.blue,.orange,.gray{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#3e8264}.blue{stroke:#547dad}.orange{stroke:#c48a42}.gray{stroke:#8e9f96}.box{fill:#f5f7f0;stroke:#8fa794;stroke-width:1.4}.sample{fill:#d6e6c8;stroke:#73926a;stroke-width:1.4}.dot,.green-fill{fill:#4f8d69}.sphere{fill:#ecf3df;stroke:#8fa794;stroke-width:2}.furnace{fill:#f8eddd;stroke:#cda36f;stroke-width:2}</style><rect x="15" y="70" width="90" height="40" rx="6" class="box"/><text x="60.0" y="94.0" class="center">Excitation</text><path d="M105 90L165 90" class="blue" marker-end="url(#arr-plqy)"/><circle cx="245" cy="100" r="65" class="sphere"/><circle cx="245" cy="100" r="10" class="dot"/><path d="M245 100L193 65" class="green"/><path d="M245 100L280 50" class="green"/><path d="M245 100L294 134" class="green"/><path d="M245 100L214 147" class="green"/><path d="M310 100L363 100" class="green" marker-end="url(#arr-plqy)"/><rect x="367" y="79" width="100" height="42" rx="6" class="box"/><text x="417.0" y="104.0" class="center">Detector</text><text x="185" y="190" class="small">Integrating sphere</text><text x="75" y="220" class="small">PLQY = emitted photons / absorbed photons</text></svg>