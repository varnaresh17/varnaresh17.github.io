<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">Chemical vapor deposition (CVD) — principle schematic</title><desc id="desc">A film grows from reactive gases. Original vector teaching diagram, not a photograph or experimental result.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#487d69"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d5e0d8"/><stop offset=".45" stop-color="#f6faf6"/><stop offset="1" stop-color="#bbcfc0"/></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#e5eff1" stop-opacity=".7"/><stop offset=".5" stop-color="#fdfefb" stop-opacity=".9"/><stop offset="1" stop-color="#c8dbd7" stop-opacity=".7"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}svg{background:#fffef9}</style><rect width="600" height="360" fill="#fffef9"/><text x="72" y="88" text-anchor="middle" font-size="18" font-weight="400" fill="#203e36">Precursor</text><text x="72" y="111" text-anchor="middle" font-size="18" font-weight="400" fill="#203e36">gas</text><path d="M28 175L144 175" stroke="#397aa4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="162" y="99" width="284" height="143" rx="12" fill="#f8eee0" stroke="#b87925" stroke-width="2.3"/><rect x="132" y="132" width="344" height="77" rx="30" fill="url(#glass)" stroke="#65796f" stroke-width="2.3"/><rect x="239" y="186" width="145" height="8" rx="1" fill="#6c8b7c" stroke="#30715a" stroke-width="2.3"/><rect x="240" y="178" width="143" height="7" rx="1" fill="#a5bdce" stroke="#397aa4" stroke-width="2.3"/><text x="304" y="70" text-anchor="middle" font-size="18" font-weight="400" fill="#203e36">Heated reaction zone</text><path d="M304 77L304 95" stroke="#65796f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="307" y="266" text-anchor="middle" font-size="18" font-weight="400" fill="#203e36">Film on substrate</text><path d="M307 248L307 197" stroke="#65796f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M479 175L574 175" stroke="#397aa4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="533" y="88" text-anchor="middle" font-size="16" font-weight="400" fill="#203e36">By-products</text><text x="533" y="111" text-anchor="middle" font-size="18" font-weight="400" fill="#203e36">out</text><path d="M25 285L575 285" stroke="#dce7dd" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="321" text-anchor="middle" font-size="18" font-weight="500" fill="#30715a">Gas transport → surface reaction → solid coating</text></svg>