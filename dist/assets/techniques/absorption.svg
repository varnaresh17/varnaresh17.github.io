<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 480 240" role="img" aria-labelledby="absorption-svg-title absorption-svg-desc"><title id="absorption-svg-title">Basic principle of Absorption</title><desc id="absorption-svg-desc">Compare incident and transmitted light at each wavelength. Absorbance measures how strongly the sample attenuates the beam.</desc><defs><marker id="arr-absorption" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f806b"/></marker></defs><style>text{font:13px Arial,sans-serif;fill:#243d35}.small{font-size:11px}.center{text-anchor:middle}.green,.blue,.orange,.gray{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#3e8264}.blue{stroke:#547dad}.orange{stroke:#c48a42}.gray{stroke:#8e9f96}.box{fill:#f5f7f0;stroke:#8fa794;stroke-width:1.4}.sample{fill:#d6e6c8;stroke:#73926a;stroke-width:1.4}.dot,.green-fill{fill:#4f8d69}.sphere{fill:#ecf3df;stroke:#8fa794;stroke-width:2}.furnace{fill:#f8eddd;stroke:#cda36f;stroke-width:2}</style><rect x="15" y="75" width="95" height="45" rx="6" class="box"/><text x="62.5" y="101.5" class="center">Selected λ</text><path d="M110 97L200 97" class="blue" marker-end="url(#arr-absorption)"/><text x="142" y="77" class="">I₀</text><rect x="205" y="60" width="60" height="85" rx="5" class="sample"/><text x="235" y="169" class="center">Sample</text><path d="M265 97L355 97" class="green" marker-end="url(#arr-absorption)"/><text x="300" y="77" class="">I</text><rect x="360" y="75" width="100" height="45" rx="6" class="box"/><text x="410.0" y="101.5" class="center">Detector</text><text x="80" y="202" class="">Absorbance A = log₁₀(I₀ / I)</text></svg>