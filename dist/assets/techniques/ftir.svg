<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 480 240" role="img" aria-labelledby="ftir-svg-title ftir-svg-desc"><title id="ftir-svg-title">Basic principle of FTIR</title><desc id="ftir-svg-desc">An interferometer modulates broadband IR light. A Fourier transform converts the measured interferogram into a spectrum of vibrational absorption.</desc><defs><marker id="arr-ftir" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f806b"/></marker></defs><style>text{font:13px Arial,sans-serif;fill:#243d35}.small{font-size:11px}.center{text-anchor:middle}.green,.blue,.orange,.gray{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#3e8264}.blue{stroke:#547dad}.orange{stroke:#c48a42}.gray{stroke:#8e9f96}.box{fill:#f5f7f0;stroke:#8fa794;stroke-width:1.4}.sample{fill:#d6e6c8;stroke:#73926a;stroke-width:1.4}.dot,.green-fill{fill:#4f8d69}.sphere{fill:#ecf3df;stroke:#8fa794;stroke-width:2}.furnace{fill:#f8eddd;stroke:#cda36f;stroke-width:2}</style><rect x="15" y="80" width="80" height="40" rx="6" class="box"/><text x="55.0" y="104.0" class="center">IR source</text><path d="M95 100L155 100" class="green" marker-end="url(#arr-ftir)"/><path d="M155 75L185 105" class="blue"/><path d="M170 90L170 35" class="blue"/><path d="M170 35L170 90" class="blue" marker-end="url(#arr-ftir)"/><path d="M156 30L184 30" class="gray"/><path d="M170 90L245 90" class="blue"/><path d="M245 90L170 90" class="blue" marker-end="url(#arr-ftir)"/><path d="M250 73L250 107" class="gray"/><text x="136" y="18" class="small">Fixed mirror</text><text x="208" y="54" class="small">Moving mirror</text><path d="M170 100L170 160" class="green" marker-end="url(#arr-ftir)"/><rect x="130" y="165" width="80" height="35" rx="6" class="box"/><text x="170.0" y="186.5" class="center">Sample</text><path d="M210 182L290 182" class="green" marker-end="url(#arr-ftir)"/><rect x="295" y="165" width="100" height="35" rx="6" class="box"/><text x="345.0" y="186.5" class="center">Detector</text><text x="296" y="130" class="small">Fourier transform</text><text x="295" y="148" class="small">→ IR absorption</text></svg>