<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 480 240" role="img" aria-labelledby="magnetic-svg-title magnetic-svg-desc"><title id="magnetic-svg-title">Basic principle of Magnetic measurements</title><desc id="magnetic-svg-desc">Record magnetic response versus field or temperature. In the vibrating-sample method illustrated, sample motion induces a voltage in pickup coils.</desc><defs><marker id="arr-magnetic" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f806b"/></marker></defs><style>text{font:13px Arial,sans-serif;fill:#243d35}.small{font-size:11px}.center{text-anchor:middle}.green,.blue,.orange,.gray{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#3e8264}.blue{stroke:#547dad}.orange{stroke:#c48a42}.gray{stroke:#8e9f96}.box{fill:#f5f7f0;stroke:#8fa794;stroke-width:1.4}.sample{fill:#d6e6c8;stroke:#73926a;stroke-width:1.4}.dot,.green-fill{fill:#4f8d69}.sphere{fill:#ecf3df;stroke:#8fa794;stroke-width:2}.furnace{fill:#f8eddd;stroke:#cda36f;stroke-width:2}</style><rect x="40" y="65" width="75" height="110" rx="6" class="box"/><text x="77.5" y="124.0" class="center">N</text><rect x="365" y="65" width="75" height="110" rx="6" class="box"/><text x="402.5" y="124.0" class="center">S</text><path d="M125 119L355 119" class="blue" marker-end="url(#arr-magnetic)"/><circle cx="240" cy="119" r="12" class="dot"/><path d="M240 44L240 93" class="gray" marker-end="url(#arr-magnetic)"/><path d="M240 194L240 145" class="gray" marker-end="url(#arr-magnetic)"/><ellipse cx="190" cy="119" rx="13" ry="36" class="orange"/><ellipse cx="290" cy="119" rx="13" ry="36" class="orange"/><text x="160" y="28" class="small">Vibrating sample (one method)</text><text x="165" y="211" class="small">Pickup coils → magnetic moment</text></svg>