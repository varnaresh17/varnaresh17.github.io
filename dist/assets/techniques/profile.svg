<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 480 240" role="img" aria-labelledby="profile-svg-title profile-svg-desc"><title id="profile-svg-title">Basic principle of Profilometry</title><desc id="profile-svg-desc">In stylus profilometry, a tip follows the surface. Its vertical displacement across a film step gives a height profile.</desc><defs><marker id="arr-profile" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f806b"/></marker></defs><style>text{font:13px Arial,sans-serif;fill:#243d35}.small{font-size:11px}.center{text-anchor:middle}.green,.blue,.orange,.gray{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#3e8264}.blue{stroke:#547dad}.orange{stroke:#c48a42}.gray{stroke:#8e9f96}.box{fill:#f5f7f0;stroke:#8fa794;stroke-width:1.4}.sample{fill:#d6e6c8;stroke:#73926a;stroke-width:1.4}.dot,.green-fill{fill:#4f8d69}.sphere{fill:#ecf3df;stroke:#8fa794;stroke-width:2}.furnace{fill:#f8eddd;stroke:#cda36f;stroke-width:2}</style><path d="M65 168H210V126H420V185H65Z" class="sample"/><path d="M245 42L295 55L280 122Z" class="box"/><path d="M170 60L355 60" class="green" marker-end="url(#arr-profile)"/><text x="190" y="43" class="small">Stylus scan</text><path d="M435 126L435 168" class="orange"/><path d="M428 126L442 126" class="orange"/><path d="M428 168L442 168" class="orange"/><text x="354" y="109" class="small">Step height</text><text x="90" y="218" class="small">Vertical stylus motion → surface profile</text></svg>