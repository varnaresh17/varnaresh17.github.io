<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 480 240" role="img" aria-labelledby="tem-svg-title tem-svg-desc"><title id="tem-svg-title">Basic principle of TEM / HRTEM</title><desc id="tem-svg-desc">Transmit electrons through a thin specimen and form an image with electron lenses. HRTEM uses interference of transmitted and diffracted waves.</desc><defs><marker id="arr-tem" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f806b"/></marker></defs><style>text{font:13px Arial,sans-serif;fill:#243d35}.small{font-size:11px}.center{text-anchor:middle}.green,.blue,.orange,.gray{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#3e8264}.blue{stroke:#547dad}.orange{stroke:#c48a42}.gray{stroke:#8e9f96}.box{fill:#f5f7f0;stroke:#8fa794;stroke-width:1.4}.sample{fill:#d6e6c8;stroke:#73926a;stroke-width:1.4}.dot,.green-fill{fill:#4f8d69}.sphere{fill:#ecf3df;stroke:#8fa794;stroke-width:2}.furnace{fill:#f8eddd;stroke:#cda36f;stroke-width:2}</style><rect x="15" y="18" width="90" height="33" rx="6" class="box"/><text x="60.0" y="38.5" class="center">Electrons</text><path d="M60 52L60 94" class="blue" marker-end="url(#arr-tem)"/><rect x="20" y="100" width="80" height="9" class="sample"/><text x="120" y="108" class="small">Thin specimen</text><path d="M60 110L35 152" class="green"/><path d="M60 110L60 152" class="green"/><path d="M60 110L85 152" class="green"/><ellipse cx="60" cy="157" rx="42" ry="8" class="box"/><text x="120" y="162" class="small">Objective lens</text><path d="M35 165L60 200" class="green"/><path d="M85 165L60 200" class="green"/><text x="20" y="222" class="small">Image</text><rect x="265" y="50" width="185" height="120" rx="6" class="box"/><text x="357.5" y="114.0" class="center"></text><path d="M280 68L435 68" class="green"/><path d="M280 84L435 84" class="green"/><path d="M280 100L435 100" class="green"/><path d="M280 116L435 116" class="green"/><path d="M280 132L435 132" class="green"/><path d="M280 148L435 148" class="green"/><text x="265" y="195" class="small">HRTEM: wave interference</text><text x="265" y="214" class="small">can reveal lattice contrast.</text></svg>