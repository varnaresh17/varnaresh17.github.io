<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 480 240" role="img" aria-labelledby="emission-svg-title emission-svg-desc"><title id="emission-svg-title">Basic principle of Emission / PL</title><desc id="emission-svg-desc">Optical excitation populates excited states. Detect emitted photons as the system relaxes radiatively.</desc><defs><marker id="arr-emission" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f806b"/></marker></defs><style>text{font:13px Arial,sans-serif;fill:#243d35}.small{font-size:11px}.center{text-anchor:middle}.green,.blue,.orange,.gray{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#3e8264}.blue{stroke:#547dad}.orange{stroke:#c48a42}.gray{stroke:#8e9f96}.box{fill:#f5f7f0;stroke:#8fa794;stroke-width:1.4}.sample{fill:#d6e6c8;stroke:#73926a;stroke-width:1.4}.dot,.green-fill{fill:#4f8d69}.sphere{fill:#ecf3df;stroke:#8fa794;stroke-width:2}.furnace{fill:#f8eddd;stroke:#cda36f;stroke-width:2}</style><rect x="16" y="45" width="112" height="42" rx="6" class="box"/><text x="72.0" y="70.0" class="center">Excitation light</text><path d="M128 66L230 66" class="blue" marker-end="url(#arr-emission)"/><circle cx="246" cy="66" r="14" class="dot"/><text x="279" y="70" class="">Sample</text><path d="M246 82L246 145" class="green" marker-end="url(#arr-emission)"/><text x="275" y="119" class="small">Emitted photons</text><rect x="166" y="151" width="160" height="40" rx="6" class="box"/><text x="246.0" y="175.0" class="center">Spectrometer</text><path d="M328 171L359 171" class="green" marker-end="url(#arr-emission)"/><rect x="365" y="151" width="98" height="40" rx="6" class="box"/><text x="414.0" y="175.0" class="center">Detector</text><text x="26" y="221" class="small">Excite → collect emission → resolve wavelength</text></svg>