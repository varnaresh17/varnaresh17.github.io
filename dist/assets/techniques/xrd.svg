<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 480 240" role="img" aria-labelledby="xrd-svg-title xrd-svg-desc"><title id="xrd-svg-title">Basic principle of XRD</title><desc id="xrd-svg-desc">Crystal planes scatter X-rays coherently. Constructive interference occurs at angles satisfying Bragg’s law.</desc><defs><marker id="arr-xrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f806b"/></marker></defs><style>text{font:13px Arial,sans-serif;fill:#243d35}.small{font-size:11px}.center{text-anchor:middle}.green,.blue,.orange,.gray{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#3e8264}.blue{stroke:#547dad}.orange{stroke:#c48a42}.gray{stroke:#8e9f96}.box{fill:#f5f7f0;stroke:#8fa794;stroke-width:1.4}.sample{fill:#d6e6c8;stroke:#73926a;stroke-width:1.4}.dot,.green-fill{fill:#4f8d69}.sphere{fill:#ecf3df;stroke:#8fa794;stroke-width:2}.furnace{fill:#f8eddd;stroke:#cda36f;stroke-width:2}</style><path d="M170 110L305 110" class="gray"/><path d="M170 130L305 130" class="gray"/><path d="M170 150L305 150" class="gray"/><path d="M65 45L230 130" class="green" marker-end="url(#arr-xrd)"/><path d="M230 130L395 45" class="green" marker-end="url(#arr-xrd)"/><text x="60" y="30" class="">X-rays</text><text x="360" y="30" class="">Detector</text><text x="175" y="175" class="">Crystal planes</text><path d="M269 130 A39 39 0 0 0 265 112" class="gray"/><text x="275" y="126" class="small">θ</text><text x="55" y="160" class="">2d sin θ = nλ</text><text x="320" y="155" class="small">Peak angles → spacing</text></svg>