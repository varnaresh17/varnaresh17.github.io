<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 480 240" role="img" aria-labelledby="icpoes-svg-title icpoes-svg-desc"><title id="icpoes-svg-title">Basic principle of ICP-OES</title><desc id="icpoes-svg-desc">Argon plasma excites sample atoms and ions. Measure their characteristic emission lines against calibration standards.</desc><defs><marker id="arr-icpoes" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f806b"/></marker></defs><style>text{font:13px Arial,sans-serif;fill:#243d35}.small{font-size:11px}.center{text-anchor:middle}.green,.blue,.orange,.gray{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#3e8264}.blue{stroke:#547dad}.orange{stroke:#c48a42}.gray{stroke:#8e9f96}.box{fill:#f5f7f0;stroke:#8fa794;stroke-width:1.4}.sample{fill:#d6e6c8;stroke:#73926a;stroke-width:1.4}.dot,.green-fill{fill:#4f8d69}.sphere{fill:#ecf3df;stroke:#8fa794;stroke-width:2}.furnace{fill:#f8eddd;stroke:#cda36f;stroke-width:2}</style><rect x="30.5" y="82" width="92" height="42" rx="6" class="box"/><text x="76.5" y="107.0" class="center">Aerosol</text><path d="M124.5 103L136.5 103" class="green" marker-end="url(#arr-icpoes)"/><rect x="139.5" y="82" width="92" height="42" rx="6" class="box"/><text x="185.5" y="107.0" class="center">Argon plasma</text><path d="M233.5 103L245.5 103" class="green" marker-end="url(#arr-icpoes)"/><rect x="248.5" y="82" width="92" height="42" rx="6" class="box"/><text x="294.5" y="107.0" class="center">Spectrometer</text><path d="M342.5 103L354.5 103" class="green" marker-end="url(#arr-icpoes)"/><rect x="357.5" y="82" width="92" height="42" rx="6" class="box"/><text x="403.5" y="107.0" class="center">Optical sensor</text><text x="153" y="57" class="small">Excited atoms / ions</text><text x="272" y="145" class="small">Resolve wavelengths</text><text x="27" y="195" class="small">Emission intensities + standards → elemental concentration.</text></svg>