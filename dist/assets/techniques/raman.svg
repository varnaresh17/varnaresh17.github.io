<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 480 240" role="img" aria-labelledby="raman-svg-title raman-svg-desc"><title id="raman-svg-title">Basic principle of Raman</title><desc id="raman-svg-desc">A small fraction of laser light scatters with a changed energy after interacting with vibrations. The frequency shift identifies vibrational modes.</desc><defs><marker id="arr-raman" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f806b"/></marker></defs><style>text{font:13px Arial,sans-serif;fill:#243d35}.small{font-size:11px}.center{text-anchor:middle}.green,.blue,.orange,.gray{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#3e8264}.blue{stroke:#547dad}.orange{stroke:#c48a42}.gray{stroke:#8e9f96}.box{fill:#f5f7f0;stroke:#8fa794;stroke-width:1.4}.sample{fill:#d6e6c8;stroke:#73926a;stroke-width:1.4}.dot,.green-fill{fill:#4f8d69}.sphere{fill:#ecf3df;stroke:#8fa794;stroke-width:2}.furnace{fill:#f8eddd;stroke:#cda36f;stroke-width:2}</style><rect x="15" y="73" width="80" height="42" rx="6" class="box"/><text x="55.0" y="98.0" class="center">Laser</text><path d="M95 94L180 94" class="blue" marker-end="url(#arr-raman)"/><circle cx="195" cy="94" r="13" class="dot"/><path d="M205 84L270 39" class="orange" marker-end="url(#arr-raman)"/><path d="M205 97L285 97" class="green" marker-end="url(#arr-raman)"/><path d="M205 106L270 151" class="blue" marker-end="url(#arr-raman)"/><text x="168" y="130" class="">Sample</text><text x="276" y="40" class="small">Raman-shifted light</text><rect x="300" y="75" width="150" height="42" rx="6" class="box"/><text x="375.0" y="100.0" class="center">Filter + spectrometer</text><text x="294" y="155" class="small">Shift → vibrations</text><text x="22" y="186" class="small">Elastic laser scattering is rejected; shifted photons are measured.</text></svg>