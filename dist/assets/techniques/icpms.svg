<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 480 240" role="img" aria-labelledby="icpms-svg-title icpms-svg-desc"><title id="icpms-svg-title">Basic principle of ICP-MS</title><desc id="icpms-svg-desc">Introduce an aerosol into argon plasma. Extract the resulting ions, separate them by mass-to-charge ratio, and count them.</desc><defs><marker id="arr-icpms" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f806b"/></marker></defs><style>text{font:13px Arial,sans-serif;fill:#243d35}.small{font-size:11px}.center{text-anchor:middle}.green,.blue,.orange,.gray{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#3e8264}.blue{stroke:#547dad}.orange{stroke:#c48a42}.gray{stroke:#8e9f96}.box{fill:#f5f7f0;stroke:#8fa794;stroke-width:1.4}.sample{fill:#d6e6c8;stroke:#73926a;stroke-width:1.4}.dot,.green-fill{fill:#4f8d69}.sphere{fill:#ecf3df;stroke:#8fa794;stroke-width:2}.furnace{fill:#f8eddd;stroke:#cda36f;stroke-width:2}</style><rect x="30.5" y="82" width="92" height="42" rx="6" class="box"/><text x="76.5" y="107.0" class="center">Aerosol</text><path d="M124.5 103L136.5 103" class="green" marker-end="url(#arr-icpms)"/><rect x="139.5" y="82" width="92" height="42" rx="6" class="box"/><text x="185.5" y="107.0" class="center">Argon plasma</text><path d="M233.5 103L245.5 103" class="green" marker-end="url(#arr-icpms)"/><rect x="248.5" y="82" width="92" height="42" rx="6" class="box"/><text x="294.5" y="107.0" class="center">Mass filter</text><path d="M342.5 103L354.5 103" class="green" marker-end="url(#arr-icpms)"/><rect x="357.5" y="82" width="92" height="42" rx="6" class="box"/><text x="403.5" y="107.0" class="center">Ion detector</text><text x="155" y="57" class="small">Atoms → ions</text><text x="283" y="145" class="small">Select m/z</text><text x="28" y="195" class="small">Ion counts + calibrated standards → elemental concentration.</text></svg>